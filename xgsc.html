<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万能嗅探搜索 - 视频/音乐/文章/网页聚合</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#eee}
/* ===== 搜索栏 ===== */
.header{height:60px;background:rgba(212,160,23,.15);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(212,160,23,.3)}
.header h1{font-size:18px;color:#f4d03f;white-space:nowrap}
.search-wrap{flex:1;display:flex;gap:8px;max-width:600px}
.search-wrap input{flex:1;padding:8px 14px;border:none;border-radius:20px;background:rgba(255,255,255,.9);font-size:15px;outline:none}
.search-wrap button{padding:8px 20px;border:none;border-radius:20px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;font-size:15px;cursor:pointer;font-weight:bold}
/* ===== 标签页 ===== */
.tabs{display:flex;gap:4px;padding:8px 16px;background:rgba(0,0,0,.2);overflow-x:auto;flex-shrink:0}
.tab{padding:6px 16px;border:none;background:transparent;color:#aaa;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tab.active{color:#f4d03f;border-bottom-color:#f4d03f}
/* ===== 内容区 ===== */
.content{flex:1;overflow-y:auto;padding:16px;height:calc(100% - 110px)}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#d4a017}
.panel{display:none}
.panel.active{display:block}
/* ===== 加载/空状态 ===== */
.loading{text-align:center;padding:40px;color:#aaa}
.empty{text-align:center;padding:40px;color:#666}
/* ===== 音乐卡片(iTunes真实API) ===== */
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.music-card{background:rgba(255,255,255,.08);border-radius:12px;overflow:hidden;transition:.2s;cursor:pointer}
.music-card:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.music-card img{width:100%;aspect-ratio:1;object-fit:cover}
.music-info{padding:8px}
.music-info h4{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-info p{font-size:11px;color:#aaa;margin-top:2px}
.music-card audio{width:100%;height:30px;margin-top:4px}
/* ===== 视频卡片(B站真实API) ===== */
.video-list{display:flex;flex-direction:column;gap:10px}
.video-item{display:flex;gap:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px;cursor:pointer;transition:.2s}
.video-item:hover{background:rgba(255,255,255,.15)}
.video-item .thumb{width:120px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0}
.video-item .v-info{flex:1;min-width:0}
.video-item .v-info h4{font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-item .v-info p{font-size:12px;color:#aaa;margin-top:4px}
.video-player{margin-top:12px;border-radius:12px;overflow:hidden;display:none}
.video-player iframe{width:100%;height:420px;border:0;display:block}
/* ===== iframe搜索结果 ===== */
.iframe-box{width:100%;height:100%;min-height:500px;border:none;border-radius:12px;background:#fff}
/* ===== 悬浮客服(必须移植到每个新网站) ===== */
.float-btns{position:fixed;right:0;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.float-btns.hide{transform:translateX(80px)}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:.2s}
.svc-fab{background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);animation:bounce 1.2s infinite,grad 4s infinite;color:#fff}
.back-top{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grad{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
/* 客服面板 */
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:none}
.svc-mask.show{display:block}
.svc-panel{position:fixed;right:0;top:0;width:300px;height:100%;background:rgba(30,30,46,.97);backdrop-filter:blur(15px);z-index:9999;padding:20px;overflow-y:auto;transform:translateX(100%);transition:transform .3s;display:none}
.svc-panel.open{display:block;transform:translateX(0)}
.svc-panel::-webkit-scrollbar{width:1px}
.svc-panel::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3)}
.panel-title{text-align:center;color:#f4d03f;font-size:16px;margin-bottom:16px}
.qr-frame{width:160px;height:160px;margin:0 auto;border:2px solid #d4a017;border-radius:12px;overflow:hidden;background:#fff}
.qr-frame img{width:100%;height:100%;object-fit:cover}
.qr-name{text-align:center;color:#aaa;font-size:13px;margin-top:8px}
.qr-switch{display:block;margin:8px auto;padding:4px 12px;border:1px solid #d4a017;background:transparent;color:#d4a017;border-radius:12px;cursor:pointer;font-size:12px}
.qr-tip{text-align:center;color:#888;font-size:12px;margin:8px 0}
.wx-id{text-align:center;margin:12px 0}
.wx-label{display:block;color:#888;font-size:12px}
.wx-line{display:block;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.svc-links{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.svc-link{width:48%;padding:8px;border-radius:8px;text-align:center;text-decoration:none;color:#fff;font-size:12px;display:block}
.c1{background:linear-gradient(135deg,#ff6b6b,#ee5a6f)}.c2{background:linear-gradient(135deg,#48dbfb,#0abde3)}
.c3{background:linear-gradient(135deg,#ff9ff3,#f368e0)}.c4{background:linear-gradient(135deg,#54a0ff,#5f27cd)}
.c5{background:linear-gradient(135deg,#54ca6b,#27ae60)}.c6{background:linear-gradient(135deg,#ff9f43,#e67e22)}
.c7{background:linear-gradient(135deg,#00d2d3,#01a3a8)}.c8{background:linear-gradient(135deg,#a55eea,#8854d0)}
@media(max-width:600px){.header h1{font-size:14px}.video-item .thumb{width:100px;height:67px}.music-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 万能嗅探</h1>
  <div class="search-wrap">
    <input type="text" id="kw" placeholder="输入关键词：AI教程 / 周杰伦 / 编程..." autocomplete="off">
    <button onclick="doSearch()">搜索</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="video">📺 视频</button>
  <button class="tab" data-tab="music">🎵 音乐</button>
  <button class="tab" data-tab="article">📄 文章</button>
  <button class="tab" data-tab="web">🌐 网页</button>
  <button class="tab" data-tab="map">🗺️ 地图</button>
</div>

<div class="content">
  <div class="panel active" id="panel-video">
    <div class="loading" id="videoLoading">输入关键词开始搜索视频（B站真实数据）</div>
    <div class="video-list" id="videoList"></div>
    <div class="video-player" id="videoPlayer"><iframe id="videoFrame"></iframe></div>
  </div>
  <div class="panel" id="panel-music">
    <div class="loading" id="musicLoading">输入关键词搜索音乐（iTunes真实数据，可试听）</div>
    <div class="music-grid" id="musicGrid"></div>
  </div>
  <div class="panel" id="panel-article">
    <iframe class="iframe-box" id="articleFrame" src="about:blank"></iframe>
  </div>
  <div class="panel" id="panel-web">
    <iframe class="iframe-box" id="webFrame" src="about:blank"></iframe>
  </div>
  <div class="panel" id="panel-map">
    <iframe class="iframe-box" id="mapFrame" src="about:blank"></iframe>
  </div>
</div>

<!-- ===== 悬浮客服（移植自aiss主站）===== -->
<div class="float-btns" id="floatBtns">
  <button class="fab svc-fab" id="svcToggle" title="联系客服">💬</button>
  <button class="fab back-top" id="backTop" title="返回顶部">🚀</button>
</div>
<div class="svc-mask" id="svcMask"></div>
<div class="svc-panel" id="svcPanel">
  <div class="panel-title">💬 联系客服 · 资源导航</div>
  <div class="qr-frame"><img id="qrImg" src="https://ss1319.github.io/aiss/assets/img/zsm.png" alt="赞赏码"></div>
  <div class="qr-name" id="qrName">赞赏二维码</div>
  <button class="qr-switch" onclick="switchQr()">切换到公众号</button>
  <p class="qr-tip">欢迎自愿赞赏支持作者</p>
  <div class="wx-id"><span class="wx-label">微信公众号</span><span class="wx-line" id="wxLine">wxsy1349</span></div>
  <div class="svc-links">
    <a class="svc-link c1" href="https://app.kwaixiaodian.com/page/kwaishop-store-c-frame-h5/frame?layoutType=4&hyId=kwaishop-store-c-frame-h5&sellerId=1865090819&authorId=1865090819&carrierType=29&carrierId=fva0b4kfnGw&entrance=xdhtlj" target="_blank">🛒 快手小店</a>
    <a class="svc-link c2" href="https://pd.qq.com/s/24yp7y38f" target="_blank">💬 腾讯频道</a>
    <a class="svc-link c3" href="https://www.zhihu.com/people/z6391" target="_blank">💡 知乎</a>
    <a class="svc-link c4" href="https://qm.qq.com/q/VHeRTTdQcu" target="_blank">👥 QQ群</a>
    <a class="svc-link c5" href="https://bolt.cello.so/lsypink3QTR" target="_blank">⚡ 在线编程</a>
    <a class="svc-link c6" href="https://api.u-claw.org/register?aff=9OLG" target="_blank">🦞 OpenClaw</a>
    <a class="svc-link c7" href="https://weibo.com/zdzqxt" target="_blank">📢 微博</a>
    <a class="svc-link c8" href="https://txc.qq.com/embed/367382/new-post/" target="_blank">✍️ 欢迎留言</a>
  </div>
</div>

<script>
/* ===== 标签切换 ===== */
document.querySelectorAll(".tab").forEach(function(tab){
  tab.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
    tab.classList.add("active");
    document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
    document.getElementById("panel-"+tab.dataset.tab).classList.add("active");
  };
});

/* ===== 搜索主入口 ===== */
document.getElementById("kw").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
function doSearch(){
  var kw=document.getElementById("kw").value.trim();
  if(!kw)return;
  var active=document.querySelector(".tab.active").dataset.tab;
  if(active==="video")searchVideo(kw);
  else if(active==="music")searchMusic(kw);
  else if(active==="article")searchArticle(kw);
  else if(active==="web")searchWeb(kw);
  else if(active==="map")searchMap(kw);
}

/* ===== 视频搜索：B站真实API ===== */
function searchVideo(kw){
  var loading=document.getElementById("videoLoading");
  var list=document.getElementById("videoList");
  var player=document.getElementById("videoPlayer");
  loading.style.display="block";loading.textContent="搜索B站视频中...";
  list.innerHTML="";player.style.display="none";
  fetch("https://api.bilibili.com/x/web-interface/search/all/v2?keyword="+encodeURIComponent(kw)+"&page=1")
    .then(function(r){return r.json();})
    .then(function(d){
      loading.style.display="none";
      if(d.code!==0){loading.textContent="B站API暂时不可用";return;}
      var results=[];
      if(d.data&&d.data.result){
        d.data.result.forEach(function(r){
          if(r.result_type==="video"&&r.data)results=results.concat(r.data);
        });
      }
      if(!results.length){loading.textContent="无结果";return;}
      results.slice(0,10).forEach(function(v){
        var item=document.createElement("div");
        item.className="video-item";
        item.innerHTML='<img class="thumb" src="'+(v.pic||"")+'" loading="lazy"><div class="v-info"><h4>'+v.title.replace(/<[^>]+>/g,"")+'</h4><p>UP: '+v.author+' · ▶'+v.play+' · 💬'+v.video_review+'</p></div>';
        item.onclick=function(){playBili(v.bvid,v.cid||v.cid_);};
        list.appendChild(item);
      });
    })
    .catch(function(){loading.textContent="网络错误，请检查网络后重试";});
}

function playBili(bvid,cid){
  var player=document.getElementById("videoPlayer");
  player.style.display="block";
  document.getElementById("videoFrame").src="https://player.bilibili.com/player.html?bvid="+bvid+"&cid="+cid+"&autoplay=1";
  player.scrollIntoView({behavior:"smooth"});
}

/* ===== 音乐搜索：iTunes真实API（支持CORS，可试听）===== */
function searchMusic(kw){
  var loading=document.getElementById("musicLoading");
  var grid=document.getElementById("musicGrid");
  loading.style.display="block";loading.textContent="搜索音乐中...";
  grid.innerHTML="";
  fetch("https://itunes.apple.com/search?term="+encodeURIComponent(kw)+"&media=music&limit=20")
    .then(function(r){return r.json();})
    .then(function(d){
      loading.style.display="none";
      if(!d.results||!d.results.length){loading.textContent="无结果";return;}
      d.results.forEach(function(t){
        var card=document.createElement("div");
        card.className="music-card";
        var art=t.artworkUrl100||"";
        card.innerHTML='<img src="'+art.replace("100x100","300x300")+'" loading="lazy"><div class="music-info"><h4>'+t.trackName+'</h4><p>'+t.artistName+'</p></div>';
        if(t.previewUrl){
          var audio=document.createElement("audio");
          audio.controls=true;audio.src=t.previewUrl;
          card.appendChild(audio);
        }
        grid.appendChild(card);
      });
    })
    .catch(function(){loading.textContent="音乐搜索失败";});
}

/* ===== 文章搜索：知乎/微信 iframe ===== */
function searchArticle(kw){
  document.getElementById("articleFrame").src="https://weixin.sogou.com/weixin?type=2&query="+encodeURIComponent(kw)+"&ie=utf8";
}

/* ===== 网页搜索：必应 iframe ===== */
function searchWeb(kw){
  document.getElementById("webFrame").src="https://www.bing.com/search?q="+encodeURIComponent(kw);
}

/* ===== 地图搜索：高德地图 iframe ===== */
function searchMap(kw){
  document.getElementById("mapFrame").src="https://ditu.amap.com/search?query="+encodeURIComponent(kw);
}

/* ===== 悬浮客服功能 ===== */
var svcToggle=document.getElementById("svcToggle");
var svcPanel=document.getElementById("svcPanel");
var svcMask=document.getElementById("svcMask");
svcToggle.onclick=function(e){
  e.stopPropagation();
  svcPanel.classList.toggle("open");
  svcMask.classList.toggle("show");
};
svcMask.onclick=function(){svcPanel.classList.remove("open");svcMask.classList.remove("show");};
document.onclick=function(e){
  if(svcPanel.classList.contains("open")&&!svcPanel.contains(e.target)&&e.target!==svcToggle){
    svcPanel.classList.remove("open");svcMask.classList.remove("show");
  }
};
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){svcPanel.classList.remove("open");svcMask.classList.remove("show");}
});

/* ===== 二维码切换 ===== */
var wxQr=false;
function switchQr(){
  wxQr=!wxQr;
  var img=document.getElementById("qrImg");
  var name=document.getElementById("qrName");
  if(wxQr){
    img.src="https://ss1319.github.io/aiss/assets/img/wxsy1349.png";
    name.textContent="微信公众号";
    event.target.textContent="切换到赞赏码";
  }else{
    img.src="https://ss1319.github.io/aiss/assets/img/zsm.png";
    name.textContent="赞赏二维码";
    event.target.textContent="切换到公众号";
  }
}

/* ===== 公众号悬停复制 ===== */
var wxLine=document.getElementById("wxLine");
wxLine.onmouseenter=function(){
  navigator.clipboard.writeText("wxsy1349");
  wxLine.style.opacity="0.7";
};
wxLine.onmouseleave=function(){wxLine.style.opacity="1";};

/* ===== 返回顶部 ===== */
document.getElementById("backTop").onclick=function(){
  document.querySelector(".content").scrollTo({top:0,behavior:"smooth"});
};

/* ===== 滚动隐藏悬浮按钮 ===== */
var content=document.querySelector(".content");
var floatBtns=document.getElementById("floatBtns");
var scrollTimer;
content.onscroll=function(){
  floatBtns.classList.add("hide");
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(function(){floatBtns.classList.remove("hide");},300);
};
</script>
</body>
</html>
