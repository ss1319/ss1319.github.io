<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI大全管理中心</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:#f0f2f5;color:#333}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{text-align:center;color:#333;margin-bottom:8px;font-size:24px}
.login-box .sub{text-align:center;color:#999;font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;margin:8px 0;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.login-box input:focus{border-color:#667eea}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:12px;font-weight:600}
.admin-layout{display:none;height:100vh}
.sidebar{width:240px;background:#1e293b;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:20px;font-size:18px;font-weight:700;border-bottom:1px solid #334155}
.sidebar-menu{flex:1;padding:12px;overflow-y:auto}
.menu-item{padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:10px;color:#cbd5e1}
.menu-item:hover{background:#334155}
.menu-item.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar h2{font-size:18px}
.topbar button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-left:8px}
.btn-save{background:#10b981;color:#fff}
.btn-logout{background:#ef4444;color:#fff}
.content{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}.panel.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-card .label{font-size:13px;color:#64748b;margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:700}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chart-box h3{font-size:15px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h3{font-size:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e2e8f0}
.form-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.form-row label{width:120px;font-size:14px;color:#64748b;flex-shrink:0}
.form-row input,.form-row select,.form-row textarea{flex:1;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none}
.form-row input[type=color]{width:60px;height:40px;padding:2px;cursor:pointer}
.form-row input[type=number]{width:100px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-primary{background:#667eea;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.list-item{display:flex;gap:8px;align-items:center;padding:8px;background:#f8fafc;border-radius:8px;margin-bottom:6px}
.list-item input{flex:1;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px}
.list-item .del{background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.toast{position:fixed;top:20px;right:20px;padding:14px 24px;border-radius:8px;color:#fff;z-index:9999;display:none}
.toast.show{display:block}
.editor-box{width:100%;height:400px;font-family:monospace;font-size:13px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;resize:vertical}
.preview-frame{width:100%;height:600px;border:1px solid #e2e8f0;border-radius:8px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<h1>AI管理中心</h1>
<p class="sub">登录后管理网站所有内容</p>
<input type="text" id="inpUser" value="ss1319">
<input type="password" id="inpToken" placeholder="GitHub Token">
<input type="text" id="inpRepo" value="aiss">
<button onclick="doLogin()">登录</button>
</div>
</div>

<div class="admin-layout" id="adminLayout">
<div class="sidebar">
<div class="sidebar-logo">AI管理中心</div>
<div class="sidebar-menu">
<div class="menu-item active" data-p="dash">仪表盘</div>
<div class="menu-item" data-p="search">搜索源配置</div>
<div class="menu-item" data-p="service">客服面板</div>
<div class="menu-item" data-p="ai">AI分类管理</div>
<div class="menu-item" data-p="page">AI单页编辑</div>
<div class="menu-item" data-p="style">样式主题</div>
<div class="menu-item" data-p="preview">网站预览</div>
</div>
</div>
<div class="main-area">
<div class="topbar">
<h2 id="pageTitle">仪表盘</h2>
<div><button class="btn-save" onclick="saveAll()">保存到GitHub</button><button class="btn-logout" onclick="doLogout()">退出</button></div>
</div>
<div class="content">

<div class="panel active" id="p-dash">
<div class="stats-grid">
<div class="stat-card"><div class="label">AI总数</div><div class="value" id="stTotal">0</div></div>
<div class="stat-card"><div class="label">分类数</div><div class="value" id="stCats">0</div></div>
<div class="stat-card"><div class="label">搜索源</div><div class="value" id="stSearch">0</div></div>
<div class="stat-card"><div class="label">客服按钮</div><div class="value" id="stSvc">0</div></div>
</div>
<div class="chart-row">
<div class="chart-box"><h3>分类分布</h3><canvas id="cPie"></canvas></div>
<div class="chart-box"><h3>前8分类对比</h3><canvas id="cBar"></canvas></div>
</div>
</div>

<div class="panel" id="p-search">
<div class="card"><h3>搜索Tab列表</h3><div id="slList"></div><button class="btn btn-primary" onclick="addSL()">添加</button></div>
</div>

<div class="panel" id="p-service">
<div class="card"><h3>基础设置</h3>
<div class="form-row"><label>公众号ID</label><input id="cfgWx"></div>
<div class="form-row"><label>赞赏提示</label><input id="cfgTip"></div>
</div>
<div class="card"><h3>客服按钮</h3><div id="svcList"></div><button class="btn btn-primary" onclick="addSvc()">添加按钮</button></div>
</div>

<div class="panel" id="p-ai">
<div class="card"><h3>分类管理</h3>
<div class="form-row"><label>选择分类</label><select id="catSel" onchange="loadCat()"></select></div>
<div id="aiList"></div>
<button class="btn btn-primary" onclick="addAI()">添加AI</button>
</div>
</div>

<div class="panel" id="p-page">
<div class="card"><h3>AI单页内容编辑</h3>
<p style="font-size:13px;color:#999;margin-bottom:12px">选择要编辑的AI页面，直接修改HTML源码后保存。</p>
<div class="form-row"><label>选择页面</label><select id="pageSel" onchange="loadPage()"></select></div>
<div class="form-row"><label>页面文件名</label><input id="pageName" readonly></div>
<textarea class="editor-box" id="pageEditor"></textarea>
<div style="margin-top:12px"><button class="btn btn-primary" onclick="savePage()">保存此页面</button></div>
</div>
</div>

<div class="panel" id="p-style">
<div class="card"><h3>颜色主题</h3>
<div class="form-row"><label>主色</label><input type="color" id="cMain"></div>
<div class="form-row"><label>背景色</label><input type="color" id="cBg"></div>
<div class="form-row"><label>客服按钮色</label><input type="color" id="cSvc"></div>
<div class="form-row"><label>主页按钮色</label><input type="color" id="cHome"></div>
<div class="form-row"><label>顶部按钮色</label><input type="color" id="cTop"></div>
</div>
<div class="card"><h3>字体与滚动条</h3>
<div class="form-row"><label>正文字号</label><input type="number" id="fSize"></div>
<div class="form-row"><label>标题字号</label><input type="number" id="tSize"></div>
<div class="form-row"><label>滚动条宽</label><input type="number" id="sWidth"></div>
</div>
</div>

<div class="panel" id="p-preview">
<div class="card"><h3>网站预览</h3><iframe class="preview-frame" src="https://ss1319.github.io/aiss/"></iframe></div>
</div>

</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN="",USER="",REPO="",config={};
var pieC=null,barC=null;

function b64ToStr(b64){
var bin=atob(b64);
var bytes=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
return new TextDecoder("utf-8").decode(bytes);
}
function strToB64(str){
var bytes=new TextEncoder().encode(str);
var bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
return btoa(bin);
}

function doLogin(){
USER=document.getElementById("inpUser").value.trim();
TOKEN=document.getElementById("inpToken").value.trim();
REPO=document.getElementById("inpRepo").value.trim();
if(!TOKEN){alert("请输入Token");return;}
localStorage.setItem("au",USER);localStorage.setItem("at",TOKEN);localStorage.setItem("ar",REPO);
loadCfg();
}
function doLogout(){localStorage.clear();location.reload();}

async function ghGet(path){
var r=await fetch("https://api.github.com/repos/"+USER+"/"+REPO+"/contents/"+path,{headers:{"Authorization":"token "+TOKEN}});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}
async function ghPut(path,content,sha){
var data={message:"update "+path,content:strToB64(content),branch:"main"};
if(sha)data.sha=sha;
var r=await fetch("https://api.github.com/repos/"+USER+"/"+REPO+"/contents/"+path,{method:"PUT",headers:{"Authorization":"token "+TOKEN,"Content-Type":"application/json"},body:JSON.stringify(data)});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}

async function loadCfg(){
try{
var d=await ghGet("config.json");
config=JSON.parse(b64ToStr(d.content));
config._sha=d.sha;
}catch(e){
config={siteName:"AI大全",theme:{mainColor:"#d4a017",bgColor:"#fff8e7",svcColor:"#9b59b6",homeColor:"#f39c12",topColor:"#1abc9c",fontSize:16,titleSize:32,scrollW:1},searchTabs:[],service:{publicAccount:"wxsy1349",tip:"欢迎赞赏",buttons:[]},categories:[]};
}
document.getElementById("loginScreen").style.display="none";
document.getElementById("adminLayout").style.display="flex";
renderAll();
toast("加载成功");
}

function renderAll(){
renderDash();renderSearch();renderService();renderCats();renderStyle();renderPageList();
}

function renderDash(){
var total=config.categories.reduce((s,c)=>s+c.items.length,0);
document.getElementById("stTotal").textContent=total;
document.getElementById("stCats").textContent=config.categories.length;
document.getElementById("stSearch").textContent=config.searchTabs.length;
document.getElementById("stSvc").textContent=config.service.buttons.length;
var labels=config.categories.map(c=>c.name);
var data=config.categories.map(c=>c.items.length);
var colors=["#667eea","#764ba2","#f093fb","#f5576c","#4facfe","#00f2fe","#43e97b","#38f9d7","#fa709a","#fee140","#a18cd1","#fbc2eb","#ff9a9e","#a8edea"];
if(pieC)pieC.destroy();
pieC=new Chart(document.getElementById("cPie"),{type:"doughnut",data:{labels:labels,datasets:[{data:data,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:"right"}}}});
if(barC)barC.destroy();
barC=new Chart(document.getElementById("cBar"),{type:"bar",data:{labels:labels.slice(0,8),datasets:[{data:data.slice(0,8),backgroundColor:"#667eea"}]},options:{responsive:true,plugins:{legend:{display:false}}}});
}

function renderSearch(){
var box=document.getElementById("slList");box.innerHTML="";
config.searchTabs.forEach((t,i)=>{
var d=document.createElement("div");d.className="list-item";
d.innerHTML='<input value="'+esc(t.name)+'" onchange="config.searchTabs['+i+'].name=this.value"><input value="'+esc(t.url)+'" onchange="config.searchTabs['+i+'].url=this.value"><button class="del" onclick="config.searchTabs.splice('+i+',1);renderSearch()">删</button>';
box.appendChild(d);
});
}
function addSL(){config.searchTabs.push({name:"新",url:"https://"});renderSearch();}

function renderService(){
document.getElementById("cfgWx").value=config.service.publicAccount;
document.getElementById("cfgTip").value=config.service.tip;
var box=document.getElementById("svcList");box.innerHTML="";
config.service.buttons.forEach((b,i)=>{
var d=document.createElement("div");d.className="list-item";
d.innerHTML='<input value="'+esc(b.name)+'" style="width:130px" onchange="config.service.buttons['+i+'].name=this.value"><input value="'+esc(b.url)+'" onchange="config.service.buttons['+i+'].url=this.value"><input type="color" value="'+b.color+'" onchange="config.service.buttons['+i+'].color=this.value" style="width:50px"><button class="del" onclick="config.service.buttons.splice('+i+',1);renderService()">删</button>';
box.appendChild(d);
});
}
function addSvc(){config.service.buttons.push({id:"c"+(config.service.buttons.length+1),color:"#9b59b6",name:"新按钮",url:"https://"});renderService();}

function renderCats(){
var sel=document.getElementById("catSel");sel.innerHTML="";
config.categories.forEach((c,i)=>{var o=document.createElement("option");o.value=i;o.text=c.name+" ("+c.items.length+")";sel.appendChild(o);});
loadCat();
}
function loadCat(){
var ci=document.getElementById("catSel").value;if(ci==="")return;
var cat=config.categories[ci];
var box=document.getElementById("aiList");box.innerHTML="<p style='margin-bottom:8px;color:#666'>"+cat.name+" 共"+cat.items.length+"个</p>";
cat.items.forEach((it,i)=>{
var d=document.createElement("div");d.className="list-item";
d.innerHTML='<input value="'+esc(it.n)+'" onchange="config.categories['+ci+'].items['+i+'].n=this.value"><input value="'+esc(it.f)+'" style="width:80px" onchange="config.categories['+ci+'].items['+i+'].f=this.value"><input value="'+esc(it.i)+'" style="width:45px" onchange="config.categories['+ci+'].items['+i+'].i=this.value"><input value="'+esc(it.d)+'" onchange="config.categories['+ci+'].items['+i+'].d=this.value"><button class="del" onclick="config.categories['+ci+'].items.splice('+i+',1);loadCat()">删</button>';
box.appendChild(d);
});
}
function addAI(){var ci=document.getElementById("catSel").value;if(ci==="")return;config.categories[ci].items.push({n:"新AI",f:"newai",i:"🤖",d:"描述"});loadCat();}

var pageSha="";
function renderPageList(){
var sel=document.getElementById("pageSel");sel.innerHTML="";
config.categories.forEach(c=>{
c.items.forEach(it=>{
var o=document.createElement("option");o.value=it.f;o.text=c.name+" - "+it.n;sel.appendChild(o);
});
});
}
async function loadPage(){
var f=document.getElementById("pageSel").value;
if(!f)return;
document.getElementById("pageName").value="pages/"+f+".html";
try{
var d=await ghGet("pages/"+f+".html");
document.getElementById("pageEditor").value=b64ToStr(d.content);
pageSha=d.sha;
}catch(e){document.getElementById("pageEditor").value="";pageSha="";toast("页面未找到");}
}
async function savePage(){
var f=document.getElementById("pageSel").value;
var content=document.getElementById("pageEditor").value;
try{await ghPut("pages/"+f+".html",content,pageSha);toast("保存成功");}
catch(e){toast("失败: "+e.message);}
}

function renderStyle(){
document.getElementById("cMain").value=config.theme.mainColor;
document.getElementById("cBg").value=config.theme.bgColor;
document.getElementById("cSvc").value=config.theme.svcColor;
document.getElementById("cHome").value=config.theme.homeColor;
document.getElementById("cTop").value=config.theme.topColor;
document.getElementById("fSize").value=config.theme.fontSize;
document.getElementById("tSize").value=config.theme.titleSize;
document.getElementById("sWidth").value=config.theme.scrollW;
}

document.querySelectorAll(".menu-item").forEach(m=>{m.onclick=()=>{
document.querySelectorAll(".menu-item").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
m.classList.add("active");
document.getElementById("p-"+m.dataset.p).classList.add("active");
document.getElementById("pageTitle").textContent=m.textContent.trim();
};});

async function saveAll(){
config.service.publicAccount=document.getElementById("cfgWx").value;
config.service.tip=document.getElementById("cfgTip").value;
config.theme.mainColor=document.getElementById("cMain").value;
config.theme.bgColor=document.getElementById("cBg").value;
config.theme.svcColor=document.getElementById("cSvc").value;
config.theme.homeColor=document.getElementById("cHome").value;
config.theme.topColor=document.getElementById("cTop").value;
config.theme.fontSize=parseInt(document.getElementById("fSize").value);
config.theme.titleSize=parseInt(document.getElementById("tSize").value);
config.theme.scrollW=parseInt(document.getElementById("sWidth").value);
try{await ghPut("config.json",JSON.stringify(config,null,2),config._sha);toast("保存成功");}
catch(e){toast("失败: "+e.message);}
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.background="#10b981";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}

(function(){
var u=localStorage.getItem("au"),t=localStorage.getItem("at"),r=localStorage.getItem("ar");
if(u&&t&&r){document.getElementById("inpUser").value=u;document.getElementById("inpToken").value=t;document.getElementById("inpRepo").value=r;USER=u;TOKEN=t;REPO=r;loadCfg();}
})();
</script>
</body>
</html>
