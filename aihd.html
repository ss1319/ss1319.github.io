<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI大全管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei";background:#f0f2f5;font-size:14px}
.login{position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center}
.lc{background:#fff;padding:30px;width:350px;border-radius:12px}
.lc input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}
.lc button{width:100%;padding:11px;background:#d4a017;color:#fff;border:none;border-radius:6px;margin-top:8px;cursor:pointer}
.app{display:none}
.top{background:#1a1a2e;color:#fff;padding:0 16px;height:45px;display:flex;align-items:center;justify-content:space-between}
.top button{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;margin-left:6px}
.bs{background:#10b981;color:#fff}
.bo{background:#ef4444;color:#fff}
.tabs{background:#fff;display:flex;border-bottom:2px solid #eee;flex-wrap:wrap}
.tab{padding:12px 18px;cursor:pointer;color:#666;border-bottom:3px solid transparent}
.tab.on{color:#d4a017;border-bottom-color:#d4a017;font-weight:bold}
.c{padding:16px;max-width:1000px;margin:0 auto}
.pg{display:none}.pg.on{display:block}
.card{background:#fff;padding:16px;margin-bottom:12px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eee;font-size:14px;color:#8b6914}
.fr{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.fr label{width:90px;font-size:13px;color:#666;flex-shrink:0}
.fr input,.fr select{flex:1;padding:7px;border:1px solid #ddd;border-radius:5px}
.fr input[type=color]{width:45px;flex:none}
.mini{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:12px}
.ma{background:#667eea;color:#fff}
.md{background:#ef4444;color:#fff}
.it{display:flex;gap:5px;padding:6px;background:#f8f9fa;border-radius:5px;margin-bottom:4px}
.it input{flex:1;padding:5px;border:1px solid #ddd;border-radius:4px;font-size:12px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{background:#fff;padding:14px;text-align:center;border-radius:8px}
.sc b{font-size:24px;display:block;color:#b8860b}
.sc span{font-size:11px;color:#999}
.ce{width:100%;height:350px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ddd;border-radius:6px}
</style>
</head>
<body>

<div class="login" id="pL">
<div class="lc">
<h2 style="text-align:center;margin-bottom:14px">AI大全管理</h2>
<p style="text-align:center;color:#999;font-size:12px;margin-bottom:10px">输入Token后点登录</p>
<input type="text" id="iU" value="ss1319">
<input type="password" id="iT" placeholder="Token">
<input type="text" id="iR" value="aiss">
<button onclick="login()">登录</button>
</div>
</div>

<div class="app" id="pA">
<div class="top">
<b>AI大全管理</b>
<div><button class="bs" onclick="saveAll()">保存</button><button class="bo" onclick="logout()">退出</button></div>
</div>
<div class="tabs">
<div class="tab on" data="dash">仪表盘</div>
<div class="tab" data="search">搜索源</div>
<div class="tab" data="svc">客服面板</div>
<div class="tab" data="cat">AI分类</div>
<div class="tab" data="page">单页编辑</div>
<div class="tab" data="style">样式</div>
</div>
<div class="c">

<div class="pg on" id="pg-dash">
<div class="st">
<div class="sc"><b id="k1">0</b><span>AI总数</span></div>
<div class="sc"><b id="k2">0</b><span>分类数</span></div>
<div class="sc"><b id="k3">0</b><span>搜索源</span></div>
<div class="sc"><b id="k4">0</b><span>按钮</span></div>
</div>
<div class="card"><p>点上方Tab切换。改完点右上角保存。</p></div>
</div>

<div class="pg" id="pg-search">
<div class="card"><h3>搜索源</h3><div id="sList"></div><button class="mini ma" onclick="addS()">+ 添加</button></div>
</div>

<div class="pg" id="pg-svc">
<div class="card"><h3>客服</h3>
<div class="fr"><label>公众号</label><input id="fWx"></div>
<div class="fr"><label>提示语</label><input id="fTip"></div>
</div>
<div class="card"><h3>按钮</h3><div id="bList"></div><button class="mini ma" onclick="addB()">+ 添加</button></div>
</div>

<div class="pg" id="pg-cat">
<div class="card"><h3>AI分类</h3>
<div class="fr"><label>选分类</label><select id="cSel" onchange="loadC()"></select></div>
<div id="aList"></div>
<button class="mini ma" onclick="addA()">+ 添加AI</button>
</div>
</div>

<div class="pg" id="pg-page">
<div class="card"><h3>单页编辑</h3>
<div class="fr"><label>选页面</label><select id="pSel" onchange="loadP()"></select></div>
<div class="fr"><label>路径</label><input id="pPath" readonly></div>
<textarea class="ce" id="pCode"></textarea>
<div style="margin-top:6px"><button class="mini ma" onclick="saveP()">保存</button></div>
</div>
</div>

<div class="pg" id="pg-style">
<div class="card"><h3>颜色</h3>
<div class="fr"><label>主色</label><input type="color" id="fM"></div>
<div class="fr"><label>背景</label><input type="color" id="fBg"></div>
</div>
</div>

</div>
</div>

<script>
var U="",T="",R="",C={};

function b2s(b){b=b.replace(/[\n\r]/g,'');var s=atob(b);var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}
function s2b(s){var a=new TextEncoder().encode(s);var b="";for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b);}

function login(){
U=document.getElementById("iU").value;
T=document.getElementById("iT").value;
R=document.getElementById("iR").value;
if(!T){alert("请输入Token");return;}
loadData();
}
function logout(){location.reload();}

async function gGet(p){
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{headers:{"Authorization":"token "+T}});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}
async function gPut(p,c,sha){
var d={message:"up",content:s2b(c),branch:"main"};
if(sha)d.sha=sha;
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{method:"PUT",headers:{"Authorization":"token "+T,"Content-Type":"application/json"},body:JSON.stringify(d)});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}

async function loadData(){
try{
var d=await gGet("config.json");
C=JSON.parse(b2s(d.content));
C._sha=d.sha;
}catch(e){
alert("加载失败: "+e.message);
C={searchTabs:[],customerService:{publicAccount:"wxsy1349",tip:"",buttons:[]},categories:[],theme:{}};
}
if(!C.theme)C.theme={};
if(!C.customerService)C.customerService={publicAccount:"wxsy1349",tip:"",buttons:[]};
if(!C.customerService.buttons)C.customerService.buttons=[];
if(!C.searchTabs)C.searchTabs=[];
if(!C.categories)C.categories=[];

document.getElementById("pL").style.display="none";
document.getElementById("pA").style.display="block";
try{
renderAll();
}catch(e){
document.querySelector(".c").innerHTML='<div class="card" style="color:red"><h3>渲染错误</h3><p>'+e.message+'</p><p style="font-size:11px;color:#999">'+e.stack+'</p></div>';
}
}

function renderAll(){
var tot=0;
for(var i=0;i<C.categories.length;i++){
if(!C.categories[i].items)C.categories[i].items=[];
tot+=C.categories[i].items.length;
}
document.getElementById("k1").textContent=tot;
document.getElementById("k2").textContent=C.categories.length;
document.getElementById("k3").textContent=C.searchTabs.length;
document.getElementById("k4").textContent=C.customerService.buttons.length;

var sl=document.getElementById("sList");
sl.innerHTML="";
for(var i=0;i<C.searchTabs.length;i++){
var t=C.searchTabs[i];
var d=document.createElement("div");
d.className="it";
var a=document.createElement("input");a.value=t.name||"";
a.onchange=function(idx){return function(){C.searchTabs[idx].name=this.value;};}(i);
var b=document.createElement("input");b.value=t.url||"";
b.onchange=function(idx){return function(){C.searchTabs[idx].url=this.value;};}(i);
var x=document.createElement("button");x.className="mini md";x.textContent="删";
x.onclick=function(idx){return function(){C.searchTabs.splice(idx,1);renderAll();};}(i);
d.appendChild(a);d.appendChild(b);d.appendChild(x);
sl.appendChild(d);
}

document.getElementById("fWx").value=C.customerService.publicAccount||"";
document.getElementById("fTip").value=C.customerService.tip||"";

var bl=document.getElementById("bList");
bl.innerHTML="";
for(var i=0;i<C.customerService.buttons.length;i++){
var it=C.customerService.buttons[i];
var d=document.createElement("div");
d.className="it";
var a=document.createElement("input");a.value=it.name||"";a.style.width="90px";
a.onchange=function(idx){return function(){C.customerService.buttons[idx].name=this.value;};}(i);
var b=document.createElement("input");b.value=it.url||"";
b.onchange=function(idx){return function(){C.customerService.buttons[idx].url=this.value;};}(i);
var c=document.createElement("input");c.type="color";c.value=it.color||"#9b59b6";c.style.width="40px";
c.onchange=function(idx){return function(){C.customerService.buttons[idx].color=this.value;};}(i);
var x=document.createElement("button");x.className="mini md";x.textContent="删";
x.onclick=function(idx){return function(){C.customerService.buttons.splice(idx,1);renderAll();};}(i);
d.appendChild(a);d.appendChild(b);d.appendChild(c);d.appendChild(x);
bl.appendChild(d);
}

var cs=document.getElementById("cSel");
cs.innerHTML="";
for(var i=0;i<C.categories.length;i++){
var o=document.createElement("option");
o.value=i;
o.text=C.categories[i].name+" ("+C.categories[i].items.length+")";
cs.appendChild(o);
}
loadC();

var ps=document.getElementById("pSel");
ps.innerHTML="";
for(var ci=0;ci<C.categories.length;ci++){
if(!C.categories[ci].items)C.categories[ci].items=[];
for(var ii=0;ii<C.categories[ci].items.length;ii++){
var it=C.categories[ci].items[ii];
var o=document.createElement("option");
o.value=it.f;
o.text=C.categories[ci].name+" - "+it.n;
ps.appendChild(o);
}
}

document.getElementById("fM").value=C.theme.mainColor||"#d4a017";
document.getElementById("fBg").value=C.theme.bgColor||"#fff8e7";
}

function loadC(){
var ci=document.getElementById("cSel").value;
if(ci==="")return;
var c=C.categories[ci];
if(!c.items)c.items=[];
var b=document.getElementById("aList");
b.innerHTML="<p style='font-size:12px;color:#999'>"+c.name+" 共"+c.items.length+"个</p>";
for(var i=0;i<c.items.length;i++){
var it=c.items[i];
var d=document.createElement("div");
d.className="it";
var a=document.createElement("input");a.value=it.n||"";
a.onchange=function(idx){return function(){C.categories[ci].items[idx].n=this.value;};}(i);
var b2=document.createElement("input");b2.value=it.f||"";b2.style.width="70px";
b2.onchange=function(idx){return function(){C.categories[ci].items[idx].f=this.value;};}(i);
var ic=document.createElement("input");ic.value=it.i||"";ic.style.width="35px";
ic.onchange=function(idx){return function(){C.categories[ci].items[idx].i=this.value;};}(i);
var ds=document.createElement("input");ds.value=it.d||"";
ds.onchange=function(idx){return function(){C.categories[ci].items[idx].d=this.value;};}(i);
var x=document.createElement("button");x.className="mini md";x.textContent="删";
x.onclick=function(idx){return function(){C.categories[ci].items.splice(idx,1);loadC();};}(i);
d.appendChild(a);d.appendChild(b2);d.appendChild(ic);d.appendChild(ds);d.appendChild(x);
b.appendChild(d);
}
}

function addA(){var ci=document.getElementById("cSel").value;if(ci==="")return;C.categories[ci].items.push({n:"新",f:"newai",i:"🤖",d:""});loadC();renderAll();}
function addS(){C.searchTabs.push({name:"新",url:"https://"});renderAll();}
function addB(){C.customerService.buttons.push({color:"#9b59b6",name:"新",url:"https://"});renderAll();}

var pSha="";
async function loadP(){
var f=document.getElementById("pSel").value;
if(!f)return;
document.getElementById("pPath").value="pages/"+f+".html";
try{
var d=await gGet("pages/"+f+".html");
document.getElementById("pCode").value=b2s(d.content);
pSha=d.sha;
}catch(e){document.getElementById("pCode").value="";pSha="";}
}
async function saveP(){
var f=document.getElementById("pSel").value;
var code=document.getElementById("pCode").value;
try{await gPut("pages/"+f+".html",code,pSha);alert("保存成功");}
catch(e){alert("失败:"+e.message);}
}

document.querySelectorAll(".tab").forEach(function(t){
t.onclick=function(){
document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
document.querySelectorAll(".pg").forEach(function(x){x.classList.remove("on");});
t.classList.add("on");
document.getElementById("pg-"+t.dataset.p).classList.add("on");
};
});

async function saveAll(){
C.customerService.publicAccount=document.getElementById("fWx").value;
C.customerService.tip=document.getElementById("fTip").value;
C.theme.mainColor=document.getElementById("fM").value;
C.theme.bgColor=document.getElementById("fBg").value;
try{
await gPut("config.json",JSON.stringify(C,null,2),C._sha);
alert("保存成功！约1分钟后更新");
}catch(e){alert("失败:"+e.message);}
}
</script>
</body>
</html>
