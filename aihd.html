<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI大全管理中心</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:36px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h2{text-align:center;margin-bottom:20px;color:#333}
.login-box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:10px;font-weight:bold}
.wrap{display:none;height:100vh;flex-direction:column}
.top{height:55px;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.top .btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;margin-left:8px;font-size:13px}
.btn-save{background:#10b981;color:#fff}
.btn-out{background:#ef4444;color:#fff}
.body{flex:1;display:flex;overflow:hidden}
.side{width:200px;background:#1e293b;color:#cbd5e1;padding:10px;overflow-y:auto}
.side div{padding:11px 14px;border-radius:8px;cursor:pointer;margin-bottom:3px;font-size:14px}
.side div:hover{background:#334155;color:#fff}
.side div.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.main{flex:1;overflow-y:auto;padding:20px}
.page{display:none}.page.on{display:block}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:15px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eee;color:#1e293b}
.row{display:flex;align-items:center;margin-bottom:10px;gap:10px}
.row label{width:110px;color:#666;font-size:13px;flex-shrink:0}
.row input,.row select,.row textarea{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:13px}
.row input[type=color]{width:55px;height:38px;padding:2px;cursor:pointer;flex:none}
.row input[type=number]{width:90px;flex:none}
.row .mini{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;flex:none}
.add{background:#3b82f6;color:#fff}
.del{background:#ef4444;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:12px;padding:18px;text-align:center}
.stat b{font-size:26px;color:#1e293b;display:block}
.stat span{font-size:12px;color:#888}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea.code{width:100%;height:350px;font-family:monospace;font-size:12px;padding:10px;border:1px solid #ddd;border-radius:7px;resize:vertical}
iframe{width:100%;height:550px;border:1px solid #ddd;border-radius:8px}
.toast{position:fixed;top:15px;right:15px;padding:12px 22px;background:#10b981;color:#fff;border-radius:8px;z-index:999;display:none}
.item{display:flex;gap:6px;align-items:center;padding:7px;background:#f8f9fa;border-radius:7px;margin-bottom:5px}
.item input{flex:1;padding:7px;border:1px solid #ddd;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<div class="login" id="pgLogin">
<div class="login-box">
<h2>AI大全管理中心</h2>
<input type="text" id="fUser" value="ss1319">
<input type="password" id="fToken" placeholder="GitHub Token">
<input type="text" id="fRepo" value="aiss">
<button onclick="login()">登 录</button>
</div>
</div>

<div class="wrap" id="pgAdmin">
<div class="top">
<strong>AI大全管理中心</strong>
<div><button class="btn btn-save" onclick="saveAll()">保存全部</button><button class="btn btn-out" onclick="logout()">退出</button></div>
</div>
<div class="body">
<div class="side">
<div class="on" data="dash">仪表盘</div>
<div data="search">搜索源</div>
<div data="service">客服面板</div>
<div data="ai">AI分类</div>
<div data="page">单页编辑</div>
<div data="style">样式主题</div>
<div data="preview">网站预览</div>
</div>
<div class="main">

<div class="page on" id="p-dash">
<div class="stats">
<div class="stat"><b id="sTotal">0</b><span>AI总数</span></div>
<div class="stat"><b id="sCats">0</b><span>分类数</span></div>
<div class="stat"><b id="sSearch">0</b><span>搜索源</span></div>
<div class="stat"><b id="sSvc">0</b><span>客服按钮</span></div>
</div>
<div class="charts">
<div class="card"><h3>分类分布</h3><canvas id="cPie" height="220"></canvas></div>
<div class="card"><h3>AI数量对比</h3><canvas id="cBar" height="220"></canvas></div>
</div>
</div>

<div class="page" id="p-search">
<div class="card">
<h3>搜索Tab配置</h3>
<div id="searchList"></div>
<button class="mini add" onclick="addSearch()">+ 添加搜索源</button>
</div>
</div>

<div class="page" id="p-service">
<div class="card">
<h3>基础设置</h3>
<div class="row"><label>公众号ID</label><input id="cWx"></div>
<div class="row"><label>赞赏提示语</label><input id="cTip"></div>
<div class="row"><label>赞赏码路径</label><input id="cZsm"></div>
<div class="row"><label>公众号二维码</label><input id="cWxqr"></div>
</div>
<div class="card">
<h3>客服按钮（可改名称/链接/颜色）</h3>
<div id="svcList"></div>
<button class="mini add" onclick="addSvc()">+ 添加按钮</button>
</div>
</div>

<div class="page" id="p-ai">
<div class="card">
<h3>分类管理</h3>
<div class="row"><label>选择分类</label><select id="catSel" onchange="loadCat()"></select></div>
<div id="aiBox"></div>
<button class="mini add" onclick="addAI()">+ 添加AI</button>
</div>
</div>

<div class="page" id="p-page">
<div class="card">
<h3>AI单页源码编辑</h3>
<div class="row"><label>选择页面</label><select id="pageSel" onchange="loadPage()"></select></div>
<div class="row"><label>文件路径</label><input id="pagePath" readonly></div>
<textarea class="code" id="pageCode"></textarea>
<div style="margin-top:10px"><button class="mini add" onclick="savePage()">保存此页面</button></div>
</div>
</div>

<div class="page" id="p-style">
<div class="card">
<h3>颜色主题</h3>
<div class="row"><label>主色调</label><input type="color" id="cMain"></div>
<div class="row"><label>页面背景</label><input type="color" id="cBg"></div>
<div class="row"><label>客服按钮</label><input type="color" id="cSvc"></div>
<div class="row"><label>主页按钮</label><input type="color" id="cHome"></div>
<div class="row"><label>顶部按钮</label><input type="color" id="cTop"></div>
</div>
<div class="card">
<h3>字体与滚动条</h3>
<div class="row"><label>正文字号</label><input type="number" id="cFont"></div>
<div class="row"><label>标题字号</label><input type="number" id="cTitle"></div>
<div class="row"><label>滚动条宽度</label><input type="number" id="cScroll"></div>
</div>
</div>

<div class="page" id="p-preview">
<div class="card"><h3>网站预览</h3><iframe src="https://ss1319.github.io/aiss/"></iframe></div>
</div>

</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var U="",T="",R="",cfg={};
var pie=null,bar=null;

function d2s(b){var b64=atob(b);var a=new Uint8Array(b64.length);for(var i=0;i<b64.length;i++)a[i]=b64.charCodeAt(i);return new TextDecoder("utf-8").decode(a);}
function s2d(s){var a=new TextEncoder().encode(s);var b="";for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b);}

function login(){
U=document.getElementById("fUser").value;T=document.getElementById("fToken").value;R=document.getElementById("fRepo").value;
if(!T){alert("请输入Token");return;}
localStorage.setItem("u",U);localStorage.setItem("t",T);localStorage.setItem("r",R);
loadCfg();
}
function logout(){localStorage.clear();location.reload();}

async function ghGet(p){
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{headers:{"Authorization":"token "+T}});
if(!r.ok)throw new Error(r.status);
return r.json();
}
async function ghPut(p,content,sha){
var d={message:"up "+p,content:s2d(content),branch:"main"};
if(sha)d.sha=sha;
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{method:"PUT",headers:{"Authorization":"token "+T,"Content-Type":"application/json"},body:JSON.stringify(d)});
if(!r.ok)throw new Error(r.status);
return r.json();
}

async function loadCfg(){
try{
var d=await ghGet("config.json");
cfg=JSON.parse(d2s(d.content));
cfg._sha=d.sha;
}catch(e){
cfg={theme:{mainColor:"#d4a017",bgColor:"#fff8e7",svcColor:"#9b59b6",homeColor:"#f39c12",topColor:"#1abc9c",fontSize:16,titleSize:32,scrollW:1},searchTabs:[],service:{publicAccount:"wxsy1349",tip:"欢迎赞赏",zsmImg:"assets/img/zsm.png",wxqrImg:"assets/img/wxsy1349.png",buttons:[]},categories:[]};
}
document.getElementById("pgLogin").style.display="none";
document.getElementById("pgAdmin").style.display="flex";
renderAll();
toast("加载成功");
}

function renderAll(){
renderDash();renderSearch();renderSvc();renderCats();renderStyle();renderPages();
}

function renderDash(){
var tot=0;cfg.categories.forEach(c=>tot+=c.items.length);
document.getElementById("sTotal").textContent=tot;
document.getElementById("sCats").textContent=cfg.categories.length;
document.getElementById("sSearch").textContent=cfg.searchTabs.length;
document.getElementById("sSvc").textContent=cfg.service.buttons.length;
var lb=cfg.categories.map(c=>c.name);
var dt=cfg.categories.map(c=>c.items.length);
var cl=["#667eea","#764ba2","#f093fb","#f5576c","#4facfe","#00f2fe","#43e97b","#38f9d7","#fa709a","#fee140","#a18cd1","#fbc2eb","#ff9a9e","#a8edea"];
if(pie)pie.destroy();
pie=new Chart(document.getElementById("cPie"),{type:"doughnut",data:{labels:lb,datasets:[{data:dt,backgroundColor:cl}]},options:{responsive:true,plugins:{legend:{position:"right",labels:{boxWidth:12}}}}});
if(bar)bar.destroy();
bar=new Chart(document.getElementById("cBar"),{type:"bar",data:{labels:lb.slice(0,8),datasets:[{data:dt.slice(0,8),backgroundColor:"#667eea"}]},options:{responsive:true,plugins:{legend:{display:false}}}});
}

function renderSearch(){
var b=document.getElementById("searchList");b.innerHTML="";
cfg.searchTabs.forEach(function(t,i){
var d=document.createElement("div");d.className="item";
var i1=document.createElement("input");i1.value=t.name;i1.onchange=function(){cfg.searchTabs[i].name=this.value;};
var i2=document.createElement("input");i2.value=t.url;i2.onchange=function(){cfg.searchTabs[i].url=this.value;};
var ib=document.createElement("button");ib.className="mini del";ib.textContent="删";ib.onclick=function(){cfg.searchTabs.splice(i,1);renderSearch();};
d.appendChild(i1);d.appendChild(i2);d.appendChild(ib);b.appendChild(d);
});
}
function addSearch(){cfg.searchTabs.push({name:"新",url:"https://"});renderSearch();}

function renderSvc(){
document.getElementById("cWx").value=cfg.service.publicAccount;
document.getElementById("cTip").value=cfg.service.tip;
document.getElementById("cZsm").value=cfg.service.zsmImg||"";
document.getElementById("cWxqr").value=cfg.service.wxqrImg||"";
var b=document.getElementById("svcList");b.innerHTML="";
cfg.service.buttons.forEach(function(it,i){
var d=document.createElement("div");d.className="item";
var n=document.createElement("input");n.value=it.name;n.style.width="120px";n.onchange=function(){cfg.service.buttons[i].name=this.value;};
var u=document.createElement("input");u.value=it.url;u.onchange=function(){cfg.service.buttons[i].url=this.value;};
var c=document.createElement("input");c.type="color";c.value=it.color;c.style.width="45px";c.style.flex="none";c.onchange=function(){cfg.service.buttons[i].color=this.value;};
var del=document.createElement("button");del.className="mini del";del.textContent="删";del.onclick=function(){cfg.service.buttons.splice(i,1);renderSvc();};
d.appendChild(n);d.appendChild(u);d.appendChild(c);d.appendChild(del);b.appendChild(d);
});
}
function addSvc(){cfg.service.buttons.push({id:"c"+(cfg.service.buttons.length+1),color:"#9b59b6",name:"新按钮",url:"https://"});renderSvc();}

function renderCats(){
var s=document.getElementById("catSel");s.innerHTML="";
cfg.categories.forEach(function(c,i){var o=document.createElement("option");o.value=i;o.text=c.name+" ("+c.items.length+")";s.appendChild(o);});
loadCat();
}
function loadCat(){
var ci=document.getElementById("catSel").value;if(ci==="")return;
var c=cfg.categories[ci];
var b=document.getElementById("aiBox");b.innerHTML="<p style='font-size:12px;color:#888;margin-bottom:6px'>"+c.name+" 共"+c.items.length+"个</p>";
c.items.forEach(function(it,i){
var d=document.createElement("div");d.className="item";
var n=document.createElement("input");n.value=it.n;n.onchange=function(){cfg.categories[ci].items[i].n=this.value;};
var f=document.createElement("input");f.value=it.f;f.style.width="80px";f.onchange=function(){cfg.categories[ci].items[i].f=this.value;};
var ic=document.createElement("input");ic.value=it.i;ic.style.width="40px";ic.onchange=function(){cfg.categories[ci].items[i].i=this.value;};
var ds=document.createElement("input");ds.value=it.d;ds.onchange=function(){cfg.categories[ci].items[i].d=this.value;};
var del=document.createElement("button");del.className="mini del";del.textContent="删";del.onclick=function(){cfg.categories[ci].items.splice(i,1);loadCat();};
d.appendChild(n);d.appendChild(f);d.appendChild(ic);d.appendChild(ds);d.appendChild(del);b.appendChild(d);
});
}
function addAI(){var ci=document.getElementById("catSel").value;if(ci==="")return;cfg.categories[ci].items.push({n:"新AI",f:"newai",i:"🤖",d:"描述"});loadCat();}

var pSha="";
function renderPages(){
var s=document.getElementById("pageSel");s.innerHTML="";
cfg.categories.forEach(function(c){c.items.forEach(function(it){var o=document.createElement("option");o.value=it.f;o.text=c.name+" - "+it.n;s.appendChild(o);});});
}
async function loadPage(){
var f=document.getElementById("pageSel").value;if(!f)return;
document.getElementById("pagePath").value="pages/"+f+".html";
try{var d=await ghGet("pages/"+f+".html");document.getElementById("pageCode").value=d2s(d.content);pSha=d.sha;}
catch(e){document.getElementById("pageCode").value="";pSha="";}
}
async function savePage(){
var f=document.getElementById("pageSel").value;
var code=document.getElementById("pageCode").value;
try{await ghPut("pages/"+f+".html",code,pSha);toast("保存成功");}
catch(e){toast("失败:"+e.message);}
}

function renderStyle(){
document.getElementById("cMain").value=cfg.theme.mainColor;
document.getElementById("cBg").value=cfg.theme.bgColor;
document.getElementById("cSvc").value=cfg.theme.svcColor;
document.getElementById("cHome").value=cfg.theme.homeColor;
document.getElementById("cTop").value=cfg.theme.topColor;
document.getElementById("cFont").value=cfg.theme.fontSize;
document.getElementById("cTitle").value=cfg.theme.titleSize;
document.getElementById("cScroll").value=cfg.theme.scrollW;
}

document.querySelectorAll(".side div").forEach(function(m){
m.onclick=function(){
document.querySelectorAll(".side div").forEach(function(x){x.classList.remove("on");});
document.querySelectorAll(".page").forEach(function(x){x.classList.remove("on");});
m.classList.add("on");
document.getElementById("p-"+m.dataset.p).classList.add("on");
};
});

async function saveAll(){
cfg.service.publicAccount=document.getElementById("cWx").value;
cfg.service.tip=document.getElementById("cTip").value;
cfg.service.zsmImg=document.getElementById("cZsm").value;
cfg.service.wxqrImg=document.getElementById("cWxqr").value;
cfg.theme.mainColor=document.getElementById("cMain").value;
cfg.theme.bgColor=document.getElementById("cBg").value;
cfg.theme.svcColor=document.getElementById("cSvc").value;
cfg.theme.homeColor=document.getElementById("cHome").value;
cfg.theme.topColor=document.getElementById("cTop").value;
cfg.theme.fontSize=parseInt(document.getElementById("cFont").value);
cfg.theme.titleSize=parseInt(document.getElementById("cTitle").value);
cfg.theme.scrollW=parseInt(document.getElementById("cScroll").value);
try{await ghPut("config.json",JSON.stringify(cfg,null,2),cfg._sha);toast("保存成功");}
catch(e){toast("失败:"+e.message);}
}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none";},2500);}

(function(){
var u=localStorage.getItem("u"),t=localStorage.getItem("t"),r=localStorage.getItem("r");
if(u&&t&&r){document.getElementById("fUser").value=u;document.getElementById("fToken").value=t;document.getElementById("fRepo").value=r;U=u;T=t;R=r;loadCfg();}
})();
</script>
</body>
</html>
