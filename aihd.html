<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI大全 - 可视化编辑后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:linear-gradient(135deg,#fff8e7,#ffe9b8,#fff3d6);color:#3d2914}
::-webkit-scrollbar{width:1px;height:1px}
::-webkit-scrollbar-thumb{background:#d4a017}
::-webkit-scrollbar-track{background:transparent}

/* 编辑工具栏 */
.edit-bar{position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:13px}
.edit-bar input{padding:6px 10px;border:1px solid #444;border-radius:5px;background:#222;color:#fff;font-size:13px}
.edit-bar button{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600}
.eb-save{background:#10b981;color:#fff}
.eb-preview{background:#3b82f6;color:#fff}
.eb-logout{background:#ef4444;color:#fff}
.eb-edit{background:#f59e0b;color:#fff}

/* 登录页 */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;z-index:10000}
.lc{background:#fff;padding:36px;width:380px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lc h2{text-align:center;margin-bottom:16px;color:#333}
.lc input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
.lc button{width:100%;padding:13px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border:none;border-radius:8px;margin-top:10px;cursor:pointer;font-size:15px;font-weight:700}

/* 前端样式（和aiss一模一样） */
.top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);padding:14px 20px;border-bottom:1px solid rgba(212,160,23,.25);margin-top:48px}
.top h1{font-size:22px;text-align:center;margin-bottom:12px;background:linear-gradient(135deg,#b8860b,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-row{display:flex;gap:8px;max-width:700px;margin:0 auto}
.search-row input{flex:1;padding:11px 20px;border:1.5px solid #d4a017;border-radius:25px;font-size:16px;background:#fff;outline:none}
.search-row button{padding:11px 26px;border:none;border-radius:25px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;font-size:16px;cursor:pointer;font-weight:bold}
.search-tabs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.stab{padding:6px 16px;border:1.5px solid #d4a017;border-radius:18px;background:transparent;color:#8b6914;cursor:pointer;font-size:14px}
.stab.active{background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border-color:transparent}

/* 可编辑元素 */
[contenteditable="true"]{outline:2px dashed #667eea;outline-offset:2px;cursor:text}
.edit-border{outline:2px dashed #667eea !important;outline-offset:2px;cursor:pointer}

/* 分类卡片 */
.main{max-width:100%;padding:20px 30px}
.cat{margin-bottom:16px;background:rgba(255,255,255,.9);border-radius:14px;border:1px solid rgba(212,160,23,.15);overflow:hidden}
.cat-h{padding:14px 20px;font-size:17px;font-weight:bold;color:#8b6914;cursor:pointer;background:rgba(212,160,23,.08)}
.cat-b{display:none;padding:16px 20px}
.cat.open .cat-b{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ai-card{background:#fff;border-radius:12px;padding:16px;text-align:center;border:1px solid rgba(212,160,23,.1);cursor:pointer;transition:transform .2s}
.ai-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(212,160,23,.15)}
.ai-card .ic{font-size:36px;margin-bottom:8px}
.ai-card h4{font-size:15px;color:#3d2914;margin-bottom:4px}
.ai-card p{font-size:12px;color:#999}

/* 悬浮按钮 */
.fabs{position:fixed;right:0;bottom:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.fab-home{background:linear-gradient(135deg,#f39c12,#e74c3c);color:#fff}
.fab-svc{background:linear-gradient(135deg,#9b59b6,#3498db);color:#fff;animation:bounce 1.2s infinite}
.fab-top{background:linear-gradient(135deg,#1abc9c,#2ecc71);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 客服面板 */
.svc-panel{position:fixed;right:0;top:0;width:300px;height:100%;background:rgba(255,252,240,.97);z-index:1000;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .3s}
.svc-panel.open{transform:translateX(0)}
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:999;display:none}
.svc-mask.show{display:block}

/* 编辑面板 */
.edit-panel{position:fixed;left:0;top:48px;width:280px;height:calc(100% - 48px);background:#fff;z-index:999;overflow-y:auto;padding:16px;border-right:2px solid #d4a017;display:none}
.edit-panel.show{display:block}
.edit-panel h3{font-size:14px;color:#8b6914;margin-bottom:10px}
.edit-panel input,.edit-panel select,.edit-panel textarea{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:6px;font-size:13px}
.edit-panel button{width:100%;padding:8px;background:#d4a017;color:#fff;border:none;border-radius:6px;margin-top:6px;cursor:pointer;font-size:13px}

.toast{position:fixed;top:70px;right:20px;padding:12px 24px;background:#10b981;color:#fff;border-radius:8px;z-index:9999;display:none}
</style>
</head>
<body>

<!-- 登录 -->
<div class="login" id="pL">
<div class="lc">
<h2>可视化编辑后台</h2>
<p style="text-align:center;color:#999;font-size:13px;margin-bottom:16px">和前端一模一样，直接点内容就能改</p>
<input type="text" id="iU" value="ss1319">
<input type="password" id="iT" placeholder="GitHub Token">
<input type="text" id="iR" value="aiss">
<button onclick="login()">登录</button>
</div>
</div>

<!-- 编辑工具栏 -->
<div class="edit-bar" id="ebar" style="display:none">
<b style="color:#f4d03f">可视化编辑</b>
<button class="eb-edit" onclick="toggleEdit()">编辑模式</button>
<button class="eb-save" onclick="saveAll()">保存到GitHub</button>
<button class="eb-preview" onclick="window.open('https://ss1319.github.io/aiss/','_blank')">预览前端</button>
<button class="eb-logout" onclick="logout()">退出</button>
</div>

<!-- 编辑面板 -->
<div class="edit-panel" id="epanel">
<h3>快速编辑</h3>
<p style="font-size:12px;color:#999;margin-bottom:10px">点页面上的文字直接编辑。</p>
<h3 style="margin-top:16px">搜索源配置</h3>
<div id="epSearch"></div>
<h3 style="margin-top:16px">客服按钮配置</h3>
<div id="epSvc"></div>
</div>

<!-- 前端主内容（和aiss一模一样） -->
<div class="top" id="mainTop">
<h1 contenteditable="true">全国中文AI大全 - 万能嗅探搜索</h1>
<div class="search-row">
<input type="text" id="kw" placeholder="输入关键词搜索全互联网...">
<button onclick="doSearch()">🔍 搜索</button>
</div>
<div class="search-tabs" id="searchTabs">
<button class="stab active" data-s="video">📺 视频</button>
<button class="stab" data-s="music">🎵 音乐</button>
<button class="stab" data-s="bing">🔍 必应</button>
<button class="stab" data-s="article">📄 文章</button>
<button class="stab" data-s="image">🖼️ 图片</button>
<button class="stab" data-s="so">🌐 360</button>
</div>
</div>

<div class="main" id="mainContent">
<div id="catList"></div>
</div>

<!-- 悬浮按钮 -->
<div class="fabs">
<button class="fab fab-home" onclick="alert('主页按钮')">🏠</button>
<button class="fab fab-svc" onclick="toggleSvc()">💬</button>
<button class="fab fab-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">🚀</button>
</div>

<!-- 客服面板 -->
<div class="svc-mask" id="svcMask" onclick="toggleSvc()"></div>
<div class="svc-panel" id="svcPanel">
<h3 style="margin-bottom:12px">💬 联系客服</h3>
<div style="text-align:center">
<div style="border:2px solid #d4a017;border-radius:10px;padding:8px;display:inline-block;background:#fff">
<img id="qrImg" src="https://ss1319.github.io/aiss/assets/img/zsm.png" style="width:160px;height:160px;display:block">
</div>
<div style="font-weight:bold;margin-top:8px" id="qrName">赞赏二维码</div>
<button onclick="switchQr()" style="margin-top:6px;padding:6px 14px;border:1px solid #d4a017;border-radius:15px;background:transparent;color:#8b6914;cursor:pointer;font-size:12px">切换到公众号</button>
<p style="font-size:12px;color:#999;margin-top:8px">欢迎自愿赞赏支持作者</p>
<div style="margin-top:10px;padding:8px;background:rgba(212,160,23,.1);border-radius:8px">
<span style="font-size:12px;color:#8b6914">微信公众号</span><br>
<span style="font-weight:bold;color:#b8860b;font-size:18px" id="wxLine" onmouseenter="navigator.clipboard.writeText('wxsy1349')">wxsy1349</span>
</div>
<div id="svcBtns" style="margin-top:12px"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var U="",T="",R="",C={},editMode=false;

function b2s(b64){var b=atob(b64);var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(a);}
function s2b(s){var a=new TextEncoder().encode(s);var b="";for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b);}

function login(){
U=document.getElementById("iU").value;T=document.getElementById("iT").value;R=document.getElementById("iR").value;
if(!T){alert("请输入Token");return;}
loadData();
}
function logout(){location.reload();}

async function gGet(p){
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{headers:{"Authorization":"token "+T}});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}
async function gPut(p,c,sha){
var d={message:"up",content:s2b(c),branch:"main"};
if(sha)d.sha=sha;
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{method:"PUT",headers:{"Authorization":"token "+T,"Content-Type":"application/json"},body:JSON.stringify(d)});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}

async function loadData(){
try{
var d=await gGet("config.json");
C=JSON.parse(b2s(d.content));
C._sha=d.sha;
}catch(e){
C={searchTabs:[],customerService:{publicAccount:"wxsy1349",tip:"欢迎",buttons:[]},categories:[],theme:{}};
}
if(!C.theme)C.theme={};
if(!C.customerService)C.customerService={publicAccount:"wxsy1349",tip:"欢迎",buttons:[]};
if(!C.customerService.buttons)C.customerService.buttons=[];
if(!C.searchTabs)C.searchTabs=[];
if(!C.categories)C.categories=[];

document.getElementById("pL").style.display="none";
document.getElementById("ebar").style.display="flex";
renderPage();
toast("加载成功");
}

function renderPage(){
// 渲染搜索Tab
var st=document.getElementById("searchTabs");
st.innerHTML="";
C.searchTabs.forEach(function(t,i){
var b=document.createElement("button");
b.className="stab"+(i===0?" active":"");
b.textContent=t.name;
b.onclick=function(){document.querySelectorAll(".stab").forEach(function(x){x.classList.remove("active");});b.classList.add("active");};
st.appendChild(b);
});

// 渲染AI分类
var cl=document.getElementById("catList");
cl.innerHTML="";
C.categories.forEach(function(c,ci){
var d=document.createElement("div");
d.className="cat"+(ci===0?" open":"");
var h=document.createElement("div");
h.className="cat-h";
h.textContent=c.name+" ("+c.items.length+")";
h.onclick=function(){d.classList.toggle("open");};
var b=document.createElement("div");
b.className="cat-b";
var g=document.createElement("div");
g.className="grid";
c.items.forEach(function(it){
var card=document.createElement("div");
card.className="ai-card";
card.innerHTML='<div class="ic">'+(it.i||"🤖")+'</div><h4>'+(it.n||"")+'</h4><p>'+(it.d||"")+'</p>';
card.onclick=function(){window.open("https://ss1319.github.io/aiss/pages/"+(it.f||"")+".html","_blank");};
g.appendChild(card);
});
b.appendChild(g);
d.appendChild(h);
d.appendChild(b);
cl.appendChild(d);
});

// 渲染客服按钮
var bh="";
C.customerService.buttons.forEach(function(b){
bh+='<a href="'+b.url+'" target="_blank" style="display:block;padding:10px;margin:5px 0;background:'+b.color+'22;border-radius:8px;color:#333;text-decoration:none;font-size:13px">'+b.name+'</a>';
});
document.getElementById("svcBtns").innerHTML=bh;

// 编辑面板
var ep=document.getElementById("epSearch");
ep.innerHTML="";
C.searchTabs.forEach(function(t,i){
var d=document.createElement("div");
d.innerHTML='<input value="'+t.name+'" onchange="C.searchTabs['+i+'].name=this.value" style="margin:3px 0">';
ep.appendChild(d);
});
}

function toggleEdit(){
editMode=!editMode;
document.querySelectorAll("[contenteditable]").forEach(function(el){
if(editMode)el.setAttribute("contenteditable","true");
else el.removeAttribute("contenteditable");
});
document.getElementById("epanel").classList.toggle("show",editMode);
toast(editMode?"编辑模式开启":"编辑模式关闭");
}

function toggleSvc(){
document.getElementById("svcPanel").classList.toggle("open");
document.getElementById("svcMask").classList.toggle("show");
}
var wq=false;
function switchQr(){
wq=!wq;
document.getElementById("qrImg").src=wq?"https://ss1319.github.io/aiss/assets/img/wxsy1349.png":"https://ss1319.github.io/aiss/assets/img/zsm.png";
document.getElementById("qrName").textContent=wq?"微信公众号":"赞赏二维码";
event.target.textContent=wq?"切换到赞赏码":"切换到公众号";
}

function doSearch(){
var kw=document.getElementById("kw").value;
if(!kw){alert("请输入关键词");return;}
var s=document.querySelector(".stab.active");
if(!s)return;
var sid=s.dataset.s;
var tab=C.searchTabs.find(function(t){return t.id===sid;});
if(tab)window.open(tab.url+encodeURIComponent(kw),"_blank");
}

document.querySelectorAll(".stab").forEach(function(s){
s.onclick=function(){document.querySelectorAll(".stab").forEach(function(x){x.classList.remove("active");});s.classList.add("active");};
});

async function saveAll(){
try{
await gPut("config.json",JSON.stringify(C,null,2),C._sha);
toast("保存成功！前端约1分钟后更新");
}catch(e){alert("失败:"+e.message);}
}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none";},2500);}
</script>
</body>
</html>
