<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI大全 - 后台管理中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;font-family:"Microsoft YaHei",sans-serif}
body{background:linear-gradient(135deg,#fff8e7,#ffe9b8,#fff3d6);color:#333}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#d4a017;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

.login{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;z-index:100}
.lc{background:#fff;padding:36px;width:380px;border-radius:16px}
.lc h2{text-align:center;margin-bottom:16px;color:#333}
.lc input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.lc button{width:100%;padding:13px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border:none;border-radius:8px;margin-top:10px;cursor:pointer;font-size:15px;font-weight:700}

.app{display:none;height:100vh;flex-direction:column}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between}
.top button{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;margin-left:8px;font-size:13px}
.bs{background:#10b981;color:#fff}
.bp{background:#3b82f6;color:#fff}
.bo{background:#ef4444;color:#fff}

.body{flex:1;display:flex;overflow:hidden}
.side{width:200px;background:rgba(255,255,255,.8);border-right:2px solid #d4a017;overflow-y:auto}
.side div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid #f0e6c0}
.side div:hover{background:rgba(212,160,23,.1)}
.side div.on{background:linear-gradient(90deg,rgba(212,160,23,.3),transparent);color:#b8860b;font-weight:bold;border-left:3px solid #d4a017}

.main{flex:1;overflow-y:auto;padding:20px}
.pg{display:none}.pg.on{display:block}
.card{background:rgba(255,255,255,.9);padding:18px;margin-bottom:14px;border-radius:12px;border:1px solid rgba(212,160,23,.2)}
.card h3{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eee;font-size:15px;color:#8b6914}
.fr{display:flex;align-items:center;margin-bottom:10px;gap:10px}
.fr label{width:100px;font-size:13px;color:#666;flex-shrink:0}
.fr input,.fr select,.fr textarea{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.fr input[type=color]{width:50px;flex:none}
.mini{padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px}
.ma{background:#667eea;color:#fff}
.md{background:#ef4444;color:#fff}
.it{display:flex;gap:6px;padding:8px;background:#f8f9fa;border-radius:6px;margin-bottom:5px;align-items:center}
.it input{flex:1;padding:6px;border:1px solid #ddd;border-radius:5px;font-size:13px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sc{background:#fff;padding:16px;text-align:center;border-radius:10px}
.sc b{font-size:26px;display:block;color:#b8860b}
.sc span{font-size:12px;color:#999}
.ce{width:100%;height:400px;font-family:Consolas,monospace;font-size:12px;padding:10px;border:1px solid #ddd;border-radius:8px}
.toast{position:fixed;top:60px;right:20px;padding:12px 24px;background:#10b981;color:#fff;border-radius:8px;z-index:999;display:none}
</style>
</head>
<body>

<div class="login" id="pL">
<div class="lc">
<h2>AI大全后台管理</h2>
<p style="text-align:center;color:#999;font-size:13px;margin-bottom:16px">所有内容可视化编辑</p>
<input type="text" id="iU" value="ss1319">
<input type="password" id="iT" placeholder="GitHub Token">
<input type="text" id="iR" value="aiss">
<button onclick="login()">登录</button>
</div>
</div>

<div class="app" id="pA">
<div class="top">
<b style="color:#f4d03f">AI大全管理中心</b>
<div>
<button class="bs" onclick="saveCfg()">保存配置</button>
<button class="bp" onclick="window.open('https://ss1319.github.io/aiss/','_blank')">预览主站</button>
<button class="bo" onclick="logout()">退出</button>
</div>
</div>
<div class="body">
<div class="side">
<div class="on" data="dash">仪表盘</div>
<div data="search">搜索源</div>
<div data="svc">客服面板</div>
<div data="cat">AI分类</div>
<div data="page">AI单页编辑</div>
<div data="style">样式主题</div>
</div>
<div class="main">

<div class="pg on" id="pg-dash">
<div class="st">
<div class="sc"><b id="k1">0</b><span>AI总数</span></div>
<div class="sc"><b id="k2">0</b><span>分类数</span></div>
<div class="sc"><b id="k3">0</b><span>搜索源</span></div>
<div class="sc"><b id="k4">0</b><span>客服按钮</span></div>
</div>
<div class="card"><h3>说明</h3><p style="line-height:2">左侧切换各功能。所有修改完成后点右上角"保存配置"。前端约1分钟后更新。</p></div>
</div>

<div class="pg" id="pg-search">
<div class="card"><h3>搜索Tab列表</h3><div id="sList"></div><button class="mini ma" onclick="addS()">+ 添加搜索源</button></div>
</div>

<div class="pg" id="pg-svc">
<div class="card"><h3>客服基础</h3>
<div class="fr"><label>公众号ID</label><input id="fWx"></div>
<div class="fr"><label>提示语</label><input id="fTip"></div>
</div>
<div class="card"><h3>8色按钮</h3><div id="bList"></div><button class="mini ma" onclick="addB()">+ 添加按钮</button></div>
</div>

<div class="pg" id="pg-cat">
<div class="card"><h3>分类管理</h3>
<div class="fr"><label>选择分类</label><select id="cSel" onchange="loadC()"></select></div>
<div id="aList"></div>
<button class="mini ma" onclick="addA()">+ 添加AI</button>
<button class="mini md" onclick="addCat()" style="margin-left:8px">+ 添加分类</button>
</div>
</div>

<div class="pg" id="pg-page">
<div class="card"><h3>AI单页源码编辑</h3>
<div class="fr"><label>选择AI页面</label><select id="pSel" onchange="loadP()"></select></div>
<div class="fr"><label>文件路径</label><input id="pPath" readonly></div>
<textarea class="ce" id="pCode"></textarea>
<div style="margin-top:8px"><button class="mini ma" onclick="saveP()">保存此页面</button></div>
</div>
</div>

<div class="pg" id="pg-style">
<div class="card"><h3>颜色</h3>
<div class="fr"><label>主色</label><input type="color" id="fM"></div>
<div class="fr"><label>背景</label><input type="color" id="fBg"></div>
<div class="fr"><label>客服按钮</label><input type="color" id="fS"></div>
<div class="fr"><label>主页按钮</label><input type="color" id="fH"></div>
<div class="fr"><label>顶部按钮</label><input type="color" id="fT"></div>
</div>
<div class="card"><h3>字体滚动条</h3>
<div class="fr"><label>正文字号</label><input type="number" id="fF"></div>
<div class="fr"><label>标题字号</label><input type="number" id="fTi"></div>
<div class="fr"><label>滚动条宽</label><input type="number" id="fSc"></div>
</div>
</div>

</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var U="",T="",R="",C={};

function b2s(b64){var b=atob(b64);var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(a);}
function s2b(s){var a=new TextEncoder().encode(s);var b="";for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b);}

function login(){
U=document.getElementById("iU").value;T=document.getElementById("iT").value;R=document.getElementById("iR").value;
if(!T){alert("请输入Token");return;}
loadData();
}
function logout(){location.reload();}

async function gGet(p){
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{headers:{"Authorization":"token "+T}});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}
async function gPut(p,c,sha){
var d={message:"up",content:s2b(c),branch:"main"};
if(sha)d.sha=sha;
var r=await fetch("https://api.github.com/repos/"+U+"/"+R+"/contents/"+p,{method:"PUT",headers:{"Authorization":"token "+T,"Content-Type":"application/json"},body:JSON.stringify(d)});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}

async function loadData(){
try{
var d=await gGet("config.json");
C=JSON.parse(b2s(d.content));
C._sha=d.sha;
}catch(e){
C={searchTabs:[],customerService:{publicAccount:"wxsy1349",tip:"欢迎",buttons:[]},categories:[],theme:{}};
}
if(!C.theme)C.theme={mainColor:"#d4a017",bgColor:"#fff8e7",svcColor:"#9b59b6",homeColor:"#f39c12",topColor:"#1abc9c",fontSize:16,titleSize:32,scrollW:1};
if(!C.customerService)C.customerService={publicAccount:"wxsy1349",tip:"欢迎",buttons:[]};
if(!C.customerService.buttons)C.customerService.buttons=[];
if(!C.searchTabs)C.searchTabs=[];
if(!C.categories)C.categories=[];

document.getElementById("pL").style.display="none";
document.getElementById("pA").style.display="flex";
renderAll();
toast("加载成功");
}

function renderAll(){
var tot=0;C.categories.forEach(function(c){tot+=c.items.length;});
document.getElementById("k1").textContent=tot;
document.getElementById("k2").textContent=C.categories.length;
document.getElementById("k3").textContent=C.searchTabs.length;
document.getElementById("k4").textContent=C.customerService.buttons.length;

var sl=document.getElementById("sList");sl.innerHTML="";
C.searchTabs.forEach(function(t,i){
var d=document.createElement("div");d.className="it";
var a=document.createElement("input");a.value=t.name||"";a.onchange=function(){C.searchTabs[i].name=this.value;};
var b=document.createElement("input");b.value=t.url||"";b.onchange=function(){C.searchTabs[i].url=this.value;};
var x=document.createElement("button");x.className="mini md";x.textContent="删";x.onclick=function(){C.searchTabs.splice(i,1);renderAll();};
d.appendChild(a);d.appendChild(b);d.appendChild(x);sl.appendChild(d);
});

document.getElementById("fWx").value=C.customerService.publicAccount||"";
document.getElementById("fTip").value=C.customerService.tip||"";

var bl=document.getElementById("bList");bl.innerHTML="";
C.customerService.buttons.forEach(function(it,i){
var d=document.createElement("div");d.className="it";
var a=document.createElement("input");a.value=it.name||"";a.style.width="100px";a.onchange=function(){C.customerService.buttons[i].name=this.value;};
var b=document.createElement("input");b.value=it.url||"";b.onchange=function(){C.customerService.buttons[i].url=this.value;};
var c=document.createElement("input");c.type="color";c.value=it.color||"#9b59b6";c.style.width="45px";c.onchange=function(){C.customerService.buttons[i].color=this.value;};
var x=document.createElement("button");x.className="mini md";x.textContent="删";x.onclick=function(){C.customerService.buttons.splice(i,1);renderAll();};
d.appendChild(a);d.appendChild(b);d.appendChild(c);d.appendChild(x);bl.appendChild(d);
});

var cs=document.getElementById("cSel");cs.innerHTML="";
C.categories.forEach(function(c,i){var o=document.createElement("option");o.value=i;o.text=c.name+" ("+c.items.length+")";cs.appendChild(o);});
loadC();

var ps=document.getElementById("pSel");ps.innerHTML="";
C.categories.forEach(function(c){c.items.forEach(function(it){var o=document.createElement("option");o.value=it.f;o.text=c.name+" - "+it.n;ps.appendChild(o);});});

document.getElementById("fM").value=C.theme.mainColor;
document.getElementById("fBg").value=C.theme.bgColor;
document.getElementById("fS").value=C.theme.svcColor;
document.getElementById("fH").value=C.theme.homeColor;
document.getElementById("fT").value=C.theme.topColor;
document.getElementById("fF").value=C.theme.fontSize;
document.getElementById("fTi").value=C.theme.titleSize;
document.getElementById("fSc").value=C.theme.scrollW;
}

function loadC(){
var ci=document.getElementById("cSel").value;if(ci==="")return;
var c=C.categories[ci];
var b=document.getElementById("aList");
b.innerHTML="<p style='font-size:12px;color:#999;margin-bottom:6px'>"+c.name+" 共"+c.items.length+"个</p>";
c.items.forEach(function(it,i){
var d=document.createElement("div");d.className="it";
var a=document.createElement("input");a.value=it.n||"";a.onchange=function(){C.categories[ci].items[i].n=this.value;};
var b2=document.createElement("input");b2.value=it.f||"";b2.style.width="80px";b2.onchange=function(){C.categories[ci].items[i].f=this.value;};
var ic=document.createElement("input");ic.value=it.i||"";ic.style.width="40px";ic.onchange=function(){C.categories[ci].items[i].i=this.value;};
var ds=document.createElement("input");ds.value=it.d||"";ds.onchange=function(){C.categories[ci].items[i].d=this.value;};
var x=document.createElement("button");x.className="mini md";x.textContent="删";x.onclick=function(){C.categories[ci].items.splice(i,1);loadC();};
d.appendChild(a);d.appendChild(b2);d.appendChild(ic);d.appendChild(ds);d.appendChild(x);b.appendChild(d);
});
}
function addA(){var ci=document.getElementById("cSel").value;if(ci==="")return;C.categories[ci].items.push({n:"新AI",f:"newai",i:"🤖",d:""});loadC();renderAll();}
function addCat(){var n=prompt("分类名称：");if(!n)return;C.categories.push({name:n,items:[]});renderAll();}
function addS(){C.searchTabs.push({name:"新",url:"https://"});renderAll();}
function addB(){C.customerService.buttons.push({color:"#9b59b6",name:"新",url:"https://"});renderAll();}

var pSha="";
async function loadP(){
var f=document.getElementById("pSel").value;if(!f)return;
document.getElementById("pPath").value="pages/"+f+".html";
try{var d=await gGet("pages/"+f+".html");document.getElementById("pCode").value=b2s(d.content);pSha=d.sha;}
catch(e){document.getElementById("pCode").value="";pSha="";}
}
async function saveP(){
var f=document.getElementById("pSel").value;
var code=document.getElementById("pCode").value;
try{await gPut("pages/"+f+".html",code,pSha);toast("保存成功");}
catch(e){alert("失败:"+e.message);}
}

document.querySelectorAll(".side div").forEach(function(t){
t.onclick=function(){
document.querySelectorAll(".side div").forEach(function(x){x.classList.remove("on");});
document.querySelectorAll(".pg").forEach(function(x){x.classList.remove("on");});
t.classList.add("on");
document.getElementById("pg-"+t.dataset.p).classList.add("on");
};
});

async function saveCfg(){
C.customerService.publicAccount=document.getElementById("fWx").value;
C.customerService.tip=document.getElementById("fTip").value;
C.theme.mainColor=document.getElementById("fM").value;
C.theme.bgColor=document.getElementById("fBg").value;
C.theme.svcColor=document.getElementById("fS").value;
C.theme.homeColor=document.getElementById("fH").value;
C.theme.topColor=document.getElementById("fT").value;
C.theme.fontSize=parseInt(document.getElementById("fF").value);
C.theme.titleSize=parseInt(document.getElementById("fTi").value);
C.theme.scrollW=parseInt(document.getElementById("fSc").value);
try{await gPut("config.json",JSON.stringify(C,null,2),C._sha);toast("保存成功！前端约1分钟后更新");}
catch(e){alert("失败:"+e.message);}
}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none";},2500);}
</script>
</body>
</html>
